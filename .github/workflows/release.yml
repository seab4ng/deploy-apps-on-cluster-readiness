name: Build and push image

# Runs ONLY when a tag is created (pushing a tag, or creating a GitHub
# release, which creates the tag). Tag 1.0.0 -> image sokushinbutsu/dappsoclusterr:1.0.0
on:
  push:
    tags:
      - "*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            sokushinbutsu/dappsoclusterr:${{ github.ref_name }}
            sokushinbutsu/dappsoclusterr:latest
