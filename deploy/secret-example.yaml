# Per-cluster ArgoCD repositories secret, created by the cluster-provisioning
# job (Jenkins) on the MANAGEMENT cluster. The name suffix MUST equal the
# provisioning.cattle.io Cluster object's name.
apiVersion: v1
kind: Secret
metadata:
  name: argocd-repos-CLUSTER_NAME   # e.g. argocd-repos-prod-eu-1
  namespace: humus-cluster-controller
type: Opaque
stringData:
  gitlab-repo-url: "https://gitlab.example.com/group/deploy-configs.git"
  artifactory-helm-url: "https://artifactory.example.com/artifactory/api/helm/virtual-helm"
  # One account that works on both GitLab and Artifactory.
  username: "svc-argocd"
  password: "CHANGE_ME"
  git-revision: "main"
