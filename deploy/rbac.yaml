# RBAC for the c4isr cluster controller.
# The operator runs on the Rancher management cluster; everything it does on
# downstream clusters goes through the downstream kubeconfig, so no RBAC is
# needed there.
apiVersion: v1
kind: Namespace
metadata:
  name: c4isr-cluster-controller
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4isr-cluster-controller
  namespace: c4isr-cluster-controller
---
# Watch Cluster objects cluster-wide; kopf stores its progress/diff state in
# annotations on the watched object, hence "patch". Events are posted next to
# the object for visibility.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c4isr-cluster-controller
rules:
  - apiGroups: ["provisioning.cattle.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: c4isr-cluster-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: c4isr-cluster-controller
subjects:
  - kind: ServiceAccount
    name: c4isr-cluster-controller
    namespace: c4isr-cluster-controller
---
# Read the <cluster>-kubeconfig secrets Rancher creates.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: c4isr-cluster-controller-kubeconfigs
  namespace: fleet-default
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: c4isr-cluster-controller-kubeconfigs
  namespace: fleet-default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: c4isr-cluster-controller-kubeconfigs
subjects:
  - kind: ServiceAccount
    name: c4isr-cluster-controller
    namespace: c4isr-cluster-controller
---
# Read the operator ConfigMap and the per-cluster argocd-repos-<name> secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: c4isr-cluster-controller-config
  namespace: c4isr-cluster-controller
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: c4isr-cluster-controller-config
  namespace: c4isr-cluster-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: c4isr-cluster-controller-config
subjects:
  - kind: ServiceAccount
    name: c4isr-cluster-controller
    namespace: c4isr-cluster-controller
